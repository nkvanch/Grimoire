<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Grimoire</title>
<link rel="icon" href="/Grimoire/assets/favicon.png">
<script>try{var t=localStorage.getItem('grimoire-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="/Grimoire/style.css">
<script src="/Grimoire/theme.js" defer></script>
<script>
  // The browser version is a single page; a first visit to one of its inner paths lands here, so remember the path and send the
  // browser to the app's start (scripts/web/coi-bootstrap.js puts the path back; after that the service worker answers refreshes).
  if (location.pathname.indexOf('/Grimoire/app/') === 0) {
    try { sessionStorage.setItem('grimoire-deeplink', location.pathname + location.search + location.hash); } catch (e) { /* none */ }
    location.replace('/Grimoire/app/');
  }
</script>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/Grimoire/index.html"><img src="/Grimoire/assets/favicon.png" alt="">Grimoire</a>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">Dark</button>
</div></header>
<main><div class="wrap">
  <h1>Page not found</h1>
  <p>That address does not exist on this site. <a href="/Grimoire/index.html">Go to the Grimoire home page</a>.</p>
</div></main>
</body>
</html>
